name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 테스트한 dist 그대로를 배포한다: 빌드(v2 + v1 아카이브) → E2E → 통과 시에만 Pages 아티팩트 업로드
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # dist/ = v2, dist/v1/ = 태그 v1-final 빌드 (scripts/build-v1.sh)
      - run: npm run build:site
      # CI 의 webServer 는 vite preview(dist) 를 띄운다
      - run: npm run test:e2e -- --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            tests/e2e/output
          retention-days: 7
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Safari(iPhone 포함) 다운로드 경로. Linux WebKit(WebKitGTK)은 Safari 와 그리기 경로가 다르고 arm Docker 에선
  # 크래시했다 → 사용자 환경에 가까운 macOS WebKit 에서 다운로드 · 모바일 스펙만 돌린다.
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build:site
      - run: npm run test:e2e -- --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: |
            playwright-report
            test-results
            tests/e2e/output
          retention-days: 7

  deploy:
    needs: [build, webkit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
