name: Browser compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: browser-check-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  chromium:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-check-site
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: CI=1 npm run test:e2e -- --project=chromium
      - run: npm run qa:modes
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failure-evidence
          path: |
            test-results/
            playwright-report/
            tests/visual/output/modes/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: browser-check-site
          path: dist
      - run: npx playwright install webkit
      - run: CI=1 npm run test:e2e -- --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
