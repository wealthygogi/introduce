name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:site
      - run: npm run test:share
      - run: npm run test:profile
      - run: CI=1 npm run test:e2e -- --project=chromium
      - run: npm run qa:modes
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chromium-wide-png-evidence
          path: |
            tests/visual/output/modes/
            test-results/
            playwright-report/
          if-no-files-found: error
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build:site
      - run: CI=1 npm run test:e2e -- --project=webkit
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: webkit-wide-png-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error

  deploy:
    needs: [build, webkit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
